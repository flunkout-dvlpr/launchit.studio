<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="Launchit Studio is a Houston studio that builds websites and apps for small businesses, plus its own side projects and field notes.">
    <link rel="canonical" href="https://launchit.studio/">
    <meta name="theme-color" content="#f4f0e6">

    <!-- Social share tags. Crawlers (LinkedIn, Slack, iMessage, X) don't run
         JavaScript, so these have to be static here. They apply site-wide;
         the same card shows for every route. og-image.png is generated by
         `npm run og-image`. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Launchit Studio">
    <meta property="og:title" content="Launchit Studio">
    <meta property="og:description" content="A Houston studio that builds websites and apps for small businesses, plus its own side projects and field notes.">
    <meta property="og:url" content="https://launchit.studio/">
    <meta property="og:image" content="https://launchit.studio/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="launchit.studio: Build things. Websites and apps for small businesses.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Launchit Studio">
    <meta name="twitter:description" content="A Houston studio that builds websites and apps for small businesses, plus its own side projects and field notes.">
    <meta name="twitter:image" content="https://launchit.studio/og-image.png">

    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
